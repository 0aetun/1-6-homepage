<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>로그인</h2>

        <input type="text" id="username" placeholder="아이디 입력">
        <input type="password" id="password" placeholder="비밀번호 입력">

        <button onclick="login()">로그인</button>

        <p id="message"></p>
    </div>

    <script>
        function login() {

            // 미리 설정한 아이디/비밀번호
            const correctId = "admin";
            const correctPw = "1234";

            // 입력값 가져오기
            const userId = document.getElementById("username").value;
            const userPw = document.getElementById("password").value;

            // 로그인 체크
            if(userId === correctId && userPw === correctPw) {

                alert("로그인 성공!");

                // 메인 페이지 이동
                window.location.href = "./index.html";

            } else {
                document.getElementById("message").innerText =
                "아이디 또는 비밀번호가 틀렸습니다.";
            }
        }
    </script>

</body>
</html>
