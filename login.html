<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>

  <style>
    body {
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      font-family:sans-serif;
      color:white;
    }

    .box {
      background:rgba(255,255,255,0.08);
      padding:30px;
      border-radius:15px;
      text-align:center;
      width:300px;
    }

    input {
      width:90%;
      padding:10px;
      margin:10px 0;
      border:none;
      border-radius:8px;
    }

    button {
      width:95%;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#3b82f6;
      color:white;
      cursor:pointer;
    }

    p {
      color:#f87171;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>1-6 로그인</h2>

  <input type="text" id="id" placeholder="아이디">
  <input type="password" id="pw" placeholder="비밀번호">

  <button onclick="login()">로그인</button>

  <p id="msg"></p>

</div>

<script>
  // 🔥 너가 정하는 계정
  const USER = {
    id: "admin",
    pw: "1234"
  };

  function login() {
    const id = document.getElementById("id").value;
    const pw = document.getElementById("pw").value;

    if(id === USER.id && pw === USER.pw) {
      // 로그인 저장
      localStorage.setItem("login", "true");

      // 이동
      window.location.href = "index.html";
    } else {
      document.getElementById("msg").innerText = "아이디 또는 비밀번호 틀림";
    }
  }

  // 이미 로그인 되어 있으면 바로 이동
  if(localStorage.getItem("login") === "true") {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
