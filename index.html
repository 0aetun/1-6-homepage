<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  
<button onclick="location.href='./login.html'">
    로그인
</button>

<div class="background"></div>

<div class="container">

  <!-- 중앙 원 -->

  <div class="center-circle">
    <h1>1-6</h1>
    <p>CLASS PORTAL</p>
  </div>

  <!-- 메뉴 -->

  <a href="pages/notice.html" class="menu top">
    📢 공지사항
  </a>

  <a href="pages/gallery.html" class="menu right">
    🖼 갤러리
  </a>

  <a href="pages/timetable.html" class="menu left">
    📚 시간표
  </a>

  <a href="pages/homework.html" class="menu bottom">
    📝 수행평가
  </a>

  <a href="pages/members.html" class="menu top-left">
    👥 학생목록
  </a>

  <a href="pages/vote.html" class="menu top-right">
    🗳 투표
  </a>

</div>

<button onclick="logout()">로그아웃</button>

<script>
document.addEventListener("DOMContentLoaded", () => {

    if (localStorage.getItem("isLoggedIn") !== "true") {

        const elements = document.querySelectorAll("button, a");

        elements.forEach(el => {

            const isLoginBtn =
                el.getAttribute("onclick") === "location.href='./login.html'" ||
                el.getAttribute("href") === "./login.html";

            if (!isLoginBtn) {
                el.style.pointerEvents = "none";
                el.style.opacity = "0.5";
                el.style.cursor = "not-allowed";
            }
        });

        alert("로그인 후 이용 가능합니다.");
    }
});

function logout() {
    localStorage.removeItem("isLoggedIn");
    alert("로그아웃 되었습니다.");
    window.location.href = "./login.html";
}
</script>

</body>
</html>
