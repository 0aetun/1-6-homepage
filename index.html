<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1학년 6반 포털</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 로그인 상태에 따라 버튼 전환 -->
<button id="auth-btn" onclick="authAction()">로그인</button>

<div class="background"></div>

<div class="container">

  <!-- 중앙 원 -->
  <div class="center-circle">
    <h1>1-6</h1>
    <p>CLASS PORTAL</p>
  </div>

  <!-- 메뉴 -->
  <a href="pages/notice.html" class="menu top">
    📢 공지사항
  </a>

  <a href="pages/gallery.html" class="menu right">
    🖼 갤러리
  </a>

  <a href="pages/timetable.html" class="menu left">
    📚 시간표
  </a>

  <a href="pages/homework.html" class="menu bottom">
    📝 수행평가
  </a>

  <a href="pages/members.html" class="menu top-left">
    👥 학생목록
  </a>

  <a href="pages/vote.html" class="menu top-right">
    🗳 투표
  </a>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const authBtn = document.getElementById("auth-btn");
    const menus = document.querySelectorAll("a.menu");

    if (isLoggedIn) {

        // 로그인 상태 - 버튼 "로그아웃"으로, 메뉴 활성화
        authBtn.innerText = "로그아웃";

        menus.forEach(el => {
            el.style.pointerEvents = "auto";
            el.style.opacity = "1";
            el.style.cursor = "pointer";
        });

    } else {

        // 비로그인 상태 - 버튼 "로그인"으로, 메뉴 잠금
        authBtn.innerText = "로그인";

        menus.forEach(el => {
            el.style.pointerEvents = "none";
            el.style.opacity = "0.5";
            el.style.cursor = "not-allowed";
        });
    }
});

function authAction() {

    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";

    if (isLoggedIn) {
        // 로그아웃
        localStorage.removeItem("isLoggedIn");
        alert("로그아웃 되었습니다.");
        location.reload();
    } else {
        // 로그인 페이지 이동
        location.href = "./login.html";
    }
}
</script>

</body>
</html>
